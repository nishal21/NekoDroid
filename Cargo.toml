[package]
name = "nekodroid"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/nishal21/NekoDroid"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
thiserror = "2"

[profile.release]
lto = true
